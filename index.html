<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff7fb">
<title>Pink Sociology Lab — Chapter Selector</title>
<style>
:root{--pink:#f2a7c7;--pale:#fff0f6;--hot:#c7467d;--ink:#342b35;--muted:#746875;--line:#eadde5;--paper:#fff;--shadow:0 8px 26px #43233a0b}
*{box-sizing:border-box}body{margin:0;background:#fbf9fb;color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
header{max-width:1180px;margin:0 auto;padding:24px 20px 14px}.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--hot)}h1{font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.04em;margin:7px 0}header p{color:var(--muted);margin:0}
.chapterbar{position:sticky;top:0;z-index:5;background:#fbf9fbf2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 20px}.tabs{max-width:1140px;margin:auto;display:flex;gap:9px;flex-wrap:wrap}.tab{border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);padding:11px 17px;font:inherit;font-weight:750;cursor:pointer}.tab:hover{border-color:#d875a1;background:#fffafd}.tab.active{background:var(--hot);border-color:var(--hot);color:white}
main{max-width:1180px;margin:0 auto;padding:14px 20px 24px}.status{font-size:.86rem;color:var(--muted);margin:0 0 10px}.framewrap{height:calc(100vh - 205px);min-height:560px;border:1px solid var(--line);border-radius:17px;overflow:hidden;background:white;box-shadow:var(--shadow)}iframe{display:block;width:100%;height:100%;border:0;background:white}.fallback{padding:18px;color:var(--muted)}.fallback a{color:var(--hot);font-weight:700}
@media(max-width:600px){header{padding:18px 13px 12px}.chapterbar{padding:10px 13px}.tabs{display:grid;grid-template-columns:1fr 1fr}.tab{padding:10px 8px;font-size:.9rem}main{padding:12px 10px}.framewrap{height:calc(100vh - 220px);min-height:480px}}
</style>
</head>
<body>
<header><div class="eyebrow">Study · Practice · Improve</div><h1>Pink Sociology Lab</h1><p>Choose a chapter to open its MCQ practice, exam centre, and notes.</p></header>
<nav class="chapterbar" aria-label="Chapter selector"><div class="tabs"><button class="tab active" id="chapterOneTab" type="button" aria-selected="true" onclick="openChapter('one')">Chapter 1 · Sociology in a Changing World</button><button class="tab" id="cultureTab" type="button" aria-selected="false" onclick="openChapter('culture')">Culture</button></div></nav>
<main><p class="status" id="chapterStatus">Currently viewing: Chapter 1 · Sociology in a Changing World</p><div class="framewrap"><iframe id="chapterFrame" title="Selected sociology chapter" src="chapter-one-linked.html"></iframe></div><noscript><div class="fallback">JavaScript is required for the chapter switcher. Open <a href="chapter-one-linked.html">Chapter 1</a> or <a href="culture-lab-linked.html">Culture</a> directly.</div></noscript></main>
<script>
const chapters={one:{file:'chapter-one-linked.html',label:'Chapter 1 · Sociology in a Changing World',tab:'chapterOneTab'},culture:{file:'culture-lab-linked.html',label:'Culture',tab:'cultureTab'}};
function openChapter(which){const chapter=chapters[which];if(!chapter)return;const frame=document.getElementById('chapterFrame');const target=new URL(chapter.file,window.location.href).href;if(frame.src!==target)frame.src=chapter.file;document.getElementById('chapterStatus').textContent='Currently viewing: '+chapter.label;for(const [key,item] of Object.entries(chapters)){const button=document.getElementById(item.tab);const active=key===which;button.classList.toggle('active',active);button.setAttribute('aria-selected',String(active));}try{history.replaceState(null,'','#'+which)}catch(e){}}
window.addEventListener('DOMContentLoaded',()=>{const key=location.hash.slice(1);if(key==='culture')openChapter('culture');else openChapter('one')});
</script>
</body>
</html>
